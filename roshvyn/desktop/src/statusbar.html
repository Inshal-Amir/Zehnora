<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; align-items: center; gap: 10px; padding: 0 12px; font: 12px -apple-system, "Segoe UI", sans-serif;
           background: #1c1b27; color: #ecebf5; -webkit-user-select: none; overflow: hidden; }
    .brand { font-weight: 700; color: #8b7cff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; flex: none; }
    #label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #a19eb8; }
    button { border: 0; background: #5b4bdb; color: #fff; border-radius: 999px; padding: 3px 10px; cursor: pointer; font: inherit; }
  </style>
</head>
<body>
  <span class="brand">Roshvyn Desktop</span>
  <span class="dot" id="dot"></span>
  <span id="label">Checking…</span>
  <button id="folder">Change folder</button>
  <button id="account">Account</button>
  <script src="statusbar.js"></script>
</body>
</html>
