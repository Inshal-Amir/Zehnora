# Roshvyn SERVER profile (university GPU PC, Docker Desktop with WSL2 + NVIDIA GPU).
# Start with: roshvyn/scripts/server/start.sh   (never `docker compose down -v`: it deletes data)
# Only nginx publishes a port, bound to 127.0.0.1 for the Cloudflare Tunnel connector and local tests.
# Database, LiteLLM and vLLM have no published ports and live on the internal network.
name: roshvyn

x-restart: &restart
  restart: unless-stopped

networks:
  internal:
    internal: true        # no outbound internet: databases, gateway, model
  edge: {}                # nginx + cloudflared (+ outbound for the tunnel)

volumes:
  pgdata: {}

services:
  postgres:
    <<: *restart
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      ROSHVYN_PLATFORM_DB_PASSWORD_FILE: /run/secrets/pg_platform_password
      ROSHVYN_LITELLM_DB_PASSWORD_FILE: /run/secrets/pg_litellm_password
    secrets: [pg_superuser_password, pg_platform_password, pg_litellm_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30

  vllm:
    <<: *restart
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.29.0}
    # Model weights come from the host SSD (downloaded by scripts/server/download-model.sh), read-only.
    volumes:
      - ${ROSHVYN_MODEL_DIR:?set ROSHVYN_MODEL_DIR in server.env}:/models:ro
    environment:
      HF_HUB_OFFLINE: "1"   # never download at runtime; weights are pinned on disk
    command: >
      --model /models/${ROSHVYN_MODEL_SUBDIR:?set ROSHVYN_MODEL_SUBDIR}
      --served-model-name roshvyn-upstream
      --dtype bfloat16
      --max-model-len ${ROSHVYN_MAX_MODEL_LEN:-4096}
      --max-num-seqs ${ROSHVYN_MAX_NUM_SEQS:-1}
      --gpu-memory-utilization ${ROSHVYN_GPU_MEM_UTIL:-0.90}
      --enable-auto-tool-choice
      --tool-call-parser ${ROSHVYN_TOOL_PARSER:?set ROSHVYN_TOOL_PARSER (verify with vllm serve --help)}
      ${ROSHVYN_VLLM_EXTRA_ARGS:-}
      --api-key-file /run/secrets/vllm_api_key
      --host 0.0.0.0 --port 8000
    secrets: [vllm_api_key]
    networks: [internal]
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      retries: 60
      start_period: 120s

  litellm:
    <<: *restart
    build: { context: ../litellm, dockerfile: Dockerfile }
    image: roshvyn/litellm:1.102.0
    depends_on:
      postgres: { condition: service_healthy }
      vllm: { condition: service_healthy }
    environment:
      VLLM_API_BASE: http://vllm:8000/v1
      LITELLM_TELEMETRY: "False"
      DISABLE_ADMIN_UI: "True"
      STORE_MODEL_IN_DB: "False"
    secrets: [litellm_master_key, vllm_api_key, pg_litellm_password]
    command: ["/app/litellm-entrypoint.sh", "config.gpu.yaml"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 10s
      retries: 30

  platform-api:
    <<: *restart
    build: { context: ../../platform-api, dockerfile: Dockerfile }
    image: roshvyn/platform-api:0.1.0
    depends_on:
      postgres: { condition: service_healthy }
      litellm: { condition: service_healthy }
    env_file: [../../../.server-secrets/platform.env]   # generated on the PC, never committed
    environment:
      ROSHVYN_PROFILE: gpu
      ROSHVYN_LITELLM_BASE_URL: http://litellm:4000
      ROSHVYN_COOKIE_SECURE: "true"
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8200/platform/v1/health')\""]
      interval: 10s
      retries: 30

  nginx:
    <<: *restart
    image: nginx:1.29.8-alpine
    depends_on:
      platform-api: { condition: service_healthy }
    volumes:
      - ./nginx/roshvyn.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../../portal/dist:/usr/share/nginx/portal:ro
    environment:
      OWNER_DOMAIN: ${OWNER_DOMAIN:?set OWNER_DOMAIN in server.env}
      NGINX_ENVSUBST_FILTER: OWNER_DOMAIN
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge]

  cloudflared:
    <<: *restart
    image: cloudflare/cloudflared:2026.9.1
    profiles: [tunnel]      # started only after local tests pass: start.sh --with-tunnel
    depends_on: [nginx]
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflared_token
    secrets: [cloudflared_token]
    networks: [edge]

secrets:
  pg_superuser_password: { file: ../../../.server-secrets/pg_superuser_password }
  pg_platform_password: { file: ../../../.server-secrets/pg_platform_password }
  pg_litellm_password: { file: ../../../.server-secrets/pg_litellm_password }
  litellm_master_key: { file: ../../../.server-secrets/litellm_master_key }
  vllm_api_key: { file: ../../../.server-secrets/vllm_api_key }
  cloudflared_token: { file: ../../../.server-secrets/cloudflared_token }
