[project]
name = "roshvyn-platform-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "email-validator>=2.3.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.54",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
