# Zehnora SERVER profile (university GPU PC, Docker Desktop with WSL2 + NVIDIA GPU).
# Start with: zehnora/scripts/server/start.sh   (never `docker compose down -v`: it deletes data)
# Only nginx publishes a port, bound to 127.0.0.1 for the Cloudflare Tunnel connector and local tests.
# Database, LiteLLM and the model have no published ports and live on the internal network.
# The model service comes from model.<ZEHNORA_ENGINE>.yaml (llamacpp or vllm), added by scripts/server/common.sh.
name: zehnora

x-restart: &restart
  restart: unless-stopped

networks:
  internal:
    internal: true        # no outbound internet: databases, gateway, model
  edge: {}                # nginx + cloudflared (+ outbound for the tunnel)

volumes:
  pgdata: {}

services:
  postgres:
    <<: *restart
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password   # read by the entrypoint while still root
    # The zehnora_platform / zehnora_litellm roles and databases are created and kept in sync with the
    # secret files by scripts/server/start.sh (init scripts run as the postgres user and cannot read them).
    secrets: [pg_superuser_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30

  litellm:
    <<: *restart
    build: { context: ../litellm, dockerfile: Dockerfile }
    image: zehnora/litellm:1.102.0
    depends_on:
      postgres: { condition: service_healthy }
      model: { condition: service_healthy }
    environment:
      MODEL_API_BASE: http://model:8000/v1
      LITELLM_TELEMETRY: "False"
      DISABLE_ADMIN_UI: "True"
      STORE_MODEL_IN_DB: "False"
    secrets: [litellm_master_key, vllm_api_key, pg_litellm_password]
    command: ["/app/litellm-entrypoint.sh", "config.${ZEHNORA_ENGINE:-llamacpp}.yaml"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 10s
      retries: 30

  platform-api:
    <<: *restart
    build: { context: ../../platform-api, dockerfile: Dockerfile }
    image: zehnora/platform-api:0.1.0
    depends_on:
      postgres: { condition: service_healthy }
      litellm: { condition: service_healthy }
    env_file: [../../../.server-secrets/platform.env]   # generated on the PC, never committed
    environment:
      ZEHNORA_PROFILE: gpu
      ZEHNORA_LITELLM_BASE_URL: http://litellm:4000
      ZEHNORA_COOKIE_SECURE: "true"
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8200/platform/v1/health')\""]
      interval: 10s
      retries: 30

  nginx:
    <<: *restart
    image: nginx:1.29.8-alpine
    depends_on:
      platform-api: { condition: service_healthy }
    volumes:
      - ./nginx/zehnora.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../../portal/dist:/usr/share/nginx/portal:ro
    environment:
      OWNER_DOMAIN: ${OWNER_DOMAIN:?set OWNER_DOMAIN in server.env}
      NGINX_ENVSUBST_FILTER: OWNER_DOMAIN
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge]

  cloudflared:
    <<: *restart
    image: cloudflare/cloudflared:2026.9.1
    profiles: [tunnel]      # started only after local tests pass: start.sh --with-tunnel
    depends_on: [nginx]
    # Runs as the host user that owns .server-secrets (mode 600) so it can read the token file.
    user: "${ZEHNORA_HOST_UID:-1000}:${ZEHNORA_HOST_GID:-1000}"
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflared_token
    secrets: [cloudflared_token]
    networks: [edge]

  guard:
    <<: *restart
    build: { context: ../guard, dockerfile: Dockerfile }
    image: zehnora/guard:0.1.0
    # Watches GPU temperature/throttling and free RAM; stops the model to cool down or shut down (scripts/server/guard.sh).
    environment:
      ZEHNORA_HOST_UID: ${ZEHNORA_HOST_UID:-1000}
      ZEHNORA_HOST_GID: ${ZEHNORA_HOST_GID:-1000}
      ZEHNORA_GUARD_INTERVAL: ${ZEHNORA_GUARD_INTERVAL:-10}
      ZEHNORA_GUARD_COOLDOWN_C: ${ZEHNORA_GUARD_COOLDOWN_C:-80}
      ZEHNORA_GUARD_RESUME_C: ${ZEHNORA_GUARD_RESUME_C:-70}
      ZEHNORA_GUARD_SHUTDOWN_C: ${ZEHNORA_GUARD_SHUTDOWN_C:-87}
      ZEHNORA_GUARD_MAX_COOLDOWN_S: ${ZEHNORA_GUARD_MAX_COOLDOWN_S:-900}
      ZEHNORA_GUARD_MIN_RAM_MIB: ${ZEHNORA_GUARD_MIN_RAM_MIB:-1024}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ZEHNORA_REPO_DIR:?run through scripts/server}:${ZEHNORA_REPO_DIR:?run through scripts/server}
    command: ["${ZEHNORA_REPO_DIR}/zehnora/scripts/server/guard.sh"]
    network_mode: none      # needs no network; talks to Docker through the socket
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  deployer:
    <<: *restart
    build: { context: ../deployer, dockerfile: Dockerfile }
    image: zehnora/deployer:0.1.0
    profiles: [autodeploy]  # enabled by scripts/server/enable-autodeploy.sh
    environment:
      ZEHNORA_HOST_UID: ${ZEHNORA_HOST_UID:-1000}
      ZEHNORA_HOST_GID: ${ZEHNORA_HOST_GID:-1000}
      ZEHNORA_DEPLOY_INTERVAL: ${ZEHNORA_DEPLOY_INTERVAL:-300}
    # Same absolute path as on the host, so compose bind mounts started from inside resolve to host paths.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ZEHNORA_REPO_DIR:?run through scripts/server}:${ZEHNORA_REPO_DIR:?run through scripts/server}
      - ${ZEHNORA_MODEL_DIR:?set ZEHNORA_MODEL_DIR in server.env}:${ZEHNORA_MODEL_DIR:?set ZEHNORA_MODEL_DIR in server.env}:ro  # start.sh checks the model file
    command: ["${ZEHNORA_REPO_DIR}/zehnora/scripts/server/autodeploy.sh"]
    networks: [edge]        # outbound internet for git fetch

secrets:
  pg_superuser_password: { file: ../../../.server-secrets/pg_superuser_password }
  pg_platform_password: { file: ../../../.server-secrets/pg_platform_password }
  pg_litellm_password: { file: ../../../.server-secrets/pg_litellm_password }
  litellm_master_key: { file: ../../../.server-secrets/litellm_master_key }
  vllm_api_key: { file: ../../../.server-secrets/vllm_api_key }
  cloudflared_token: { file: ../../../.server-secrets/cloudflared_token }
