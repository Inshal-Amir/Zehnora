# Model engine "vllm": full-precision safetensors model, best for many concurrent users.
# Selected by ZEHNORA_ENGINE=vllm in server.env (common.sh adds this file to every compose call).
services:
  model:
    restart: unless-stopped
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.29.0}
    volumes:
      - ${ZEHNORA_MODEL_DIR:?set ZEHNORA_MODEL_DIR in server.env}:/models:ro
    environment:
      HF_HUB_OFFLINE: "1"   # never download at runtime; weights are pinned on disk
    command: >
      --model /models/${ZEHNORA_MODEL_SUBDIR:?set ZEHNORA_MODEL_SUBDIR}
      --served-model-name zehnora-upstream
      --dtype bfloat16
      --max-model-len ${ZEHNORA_MAX_MODEL_LEN:-4096}
      --max-num-seqs ${ZEHNORA_MAX_NUM_SEQS:-1}
      --gpu-memory-utilization ${ZEHNORA_GPU_MEM_UTIL:-0.90}
      --enable-auto-tool-choice
      --tool-call-parser ${ZEHNORA_TOOL_PARSER:?set ZEHNORA_TOOL_PARSER (verify with vllm serve --help)}
      ${ZEHNORA_VLLM_EXTRA_ARGS:-}
      --api-key-file /run/secrets/vllm_api_key
      --host 0.0.0.0 --port 8000
    secrets: [vllm_api_key]
    networks: [internal]
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      retries: 60
      start_period: 120s
