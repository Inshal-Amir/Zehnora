<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Approve command?</title>
  <style>
    body { font: 13px -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 18px; background: #f6f5fb; color: #1d1b29; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    p { margin: 6px 0; color: #6b6880; }
    pre { background: #1c1b27; color: #ecebf5; padding: 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; max-height: 130px; overflow: auto; }
    dl { display: grid; grid-template-columns: 90px 1fr; gap: 4px 8px; margin: 10px 0; }
    dt { color: #6b6880; } dd { margin: 0; word-break: break-all; }
    .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
    button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #e3e1ee; background: #fff; cursor: pointer; }
    button.approve { background: #c93a4a; border-color: #c93a4a; color: #fff; }
    .warn { color: #b7791f; }
  </style>
</head>
<body>
  <h1>Zehnora wants to run a command</h1>
  <p>It is not on the automatic build/test list, so it needs your approval. It runs with your user permissions.</p>
  <pre id="command"></pre>
  <dl>
    <dt>Folder</dt><dd id="cwd"></dd>
    <dt>Workspace</dt><dd id="workspace"></dd>
    <dt>Shell</dt><dd id="shell"></dd>
    <dt>Why asked</dt><dd id="reason"></dd>
  </dl>
  <p class="warn">Only approve commands you understand. Auto-deny in <span id="left">120</span> s.</p>
  <div class="row">
    <button id="deny" autofocus>Deny</button>
    <button id="approve" class="approve">Approve once</button>
  </div>
  <script src="approval.js"></script>
</body>
</html>
