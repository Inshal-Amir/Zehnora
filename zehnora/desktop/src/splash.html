<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Zehnora Desktop</title>
  <style>
    body { font: 13px -apple-system, "Segoe UI", sans-serif; margin: 0; display: grid; place-items: center; height: 100vh; background: #12111a; color: #ecebf5; }
    .box { width: 420px; }
    h1 { color: #8b7cff; margin: 0 0 4px; font-size: 26px; }
    #status { color: #a19eb8; min-height: 40px; white-space: pre-wrap; }
    form { display: none; margin-top: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 8px; border: 1px solid #2e2c3d; background: #1c1b27; color: #ecebf5; }
    button { margin-top: 8px; padding: 8px 14px; border: 0; border-radius: 8px; background: #8b7cff; color: #fff; cursor: pointer; }
    a { color: #2ed3c3; }
    #err { color: #f0697a; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Zehnora Desktop</h1>
    <div id="status">Starting…</div>
    <form id="keyform">
      <p>Paste your Zehnora API key. Create one in your <a id="portal" href="#">Zehnora account</a> (API keys page).
        It is stored encrypted by your operating system and is never shown to web pages.</p>
      <input id="key" type="password" placeholder="sk-…" autocomplete="off" />
      <button type="submit">Save key and continue</button>
      <div id="err"></div>
    </form>
  </div>
  <script src="splash.js"></script>
</body>
</html>
